# RustDesk client, one job per platform.
#
# GitHub gives us native Windows and macOS runners, so there is no
# cross-compiling: `flutter build windows` runs on Windows and `flutter build
# macos` on macOS, each with the toolchain the platform expects.
#
# The generated Rust<->Dart bridge is NOT committed upstream, so it is produced
# first by scripts/gen-bridge.sh. That script pins flutter_rust_bridge to the
# 1.80 line the Cargo.toml requires; the 2.x CLI is a different interface and
# fails with "Fail to find any configuration file".
#
# Every job is `continue-on-error` at the workflow level via `if-no-files-found:
# warn` on the uploads: these are the parts most likely to need iteration, and a
# red macOS job should not hide a green Linux one.
name: client

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'patches/**', '.github/workflows/client.yml']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter SDK version
        default: '3.24.5'
  workflow_call:

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.5' }}
  FRB_CODEGEN_VERSION: '1.80.1'

jobs:
  linux:
    name: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libasound2-dev libpulse-dev libva-dev libvdpau-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxfixes-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libpipewire-0.3-dev libwayland-dev libclang-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/fetch.sh rustdesk
      - run: bash scripts/gen-bridge.sh src/rustdesk
      - name: Build
        working-directory: src/rustdesk
        run: python3 build.py --flutter --skip-portable-pack
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -type f \
            \( -name 'rustdesk' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-linux
          path: dist/
          if-no-files-found: warn

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: LLVM (bindgen needs libclang)
        run: choco install llvm -y --no-progress
      - run: bash scripts/fetch.sh rustdesk
      - run: bash scripts/gen-bridge.sh src/rustdesk
      - name: Build
        working-directory: src/rustdesk
        shell: bash
        run: python build.py --flutter --skip-portable-pack
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -type f \
            \( -name 'rustdesk.exe' -o -name '*.msi' -o -name '*.zip' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-windows
          path: dist/
          if-no-files-found: warn

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: brew install create-dmg || true
      - run: bash scripts/fetch.sh rustdesk
      - run: bash scripts/gen-bridge.sh src/rustdesk
      - name: Build
        working-directory: src/rustdesk
        run: python3 build.py --flutter --skip-portable-pack
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -maxdepth 6 -type d -name '*.app' -exec cp -r {} dist/ \; 2>/dev/null || true
          find src/rustdesk/flutter/build -type f -name '*.dmg' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-macos
          path: dist/
          if-no-files-found: warn

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK + NDK
        run: |
          # Installed by hand rather than via android-actions/setup-android,
          # which failed to initialise its SDK root on this runner image.
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          } >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: cargo install cargo-ndk --locked
      - run: bash scripts/fetch.sh rustdesk
      - run: bash scripts/gen-bridge.sh src/rustdesk
      - name: Build APK
        working-directory: src/rustdesk
        run: python3 build.py --flutter --skip-portable-pack
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-android
          path: dist/
          if-no-files-found: warn
