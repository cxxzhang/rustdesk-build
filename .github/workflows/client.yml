# RustDesk client for every platform upstream supports, plus HarmonyOS.
#
# This is a transcription of upstream's own CI (rustdesk/rustdesk
# .github/workflows/bridge.yml + flutter-build.yml), not a from-scratch build.
# Where upstream has a helper script (flutter/ndk_arm64.sh, ios_arm64.sh,
# build_android.sh) that script is called rather than its commands re-typed —
# they encode flags and paths that are easy to get subtly wrong.
#
# The shape of every platform job is the same, and it is the part a naive build
# gets wrong:
#
#   1. install host deps (apt / brew / choco) — including gstreamer and glib
#   2. set up vcpkg and install vcpkg.json's C libraries
#      (aom, libvpx, libyuv, ffmpeg, libsodium, opus, libjpeg-turbo)
#   3. restore the bridge artifact
#   4. build the Rust lib with cargo, then let flutter package it
#
# Pinned versions are upstream's, from its env block: Rust 1.75 (1.78+ changes
# the i128 ABI and breaks sciter), 1.81 on macOS/iOS (cidre requires it),
# Flutter 3.22.3 for the desktop bridge and 3.24.5 for Android, NDK r28c,
# cargo-ndk 3.1.2, flutter_rust_bridge_codegen 1.80.1 with --features uuid.
name: client

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'patches/**', '.github/workflows/client.yml']
  workflow_dispatch:
  workflow_call:

env:
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  FLUTTER_VERSION: '3.22.3'
  ANDROID_FLUTTER_VERSION: '3.24.5'
  FRB_VERSION: '1.80.1'
  CARGO_EXPAND_VERSION: '1.0.95'
  CARGO_NDK_VERSION: '3.1.2'
  NDK_VERSION: 'r28c'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

jobs:
  # ------------------------------------------------------------------ bridge --
  bridge:
    name: generate bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch.sh rustdesk
      - name: Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev llvm-dev cmake ninja-build \
            pkg-config libgtk-3-dev nasm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: bridge }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install codegen
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" \
            --features "uuid" --locked
      - name: Prepare pubspec
        working-directory: src/rustdesk
        run: |
          # extended_text 14 needs a newer Dart than 3.22.3 ships; resolution
          # fails without this pin. Upstream does the same.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
      - name: Run codegen
        working-directory: src/rustdesk
        run: |
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            src/rustdesk/src/bridge_generated.rs
            src/rustdesk/src/bridge_generated.io.rs
            src/rustdesk/flutter/lib/generated_bridge.dart
            src/rustdesk/flutter/lib/generated_bridge.freezed.dart
            src/rustdesk/flutter/macos/Runner/bridge_generated.h
            src/rustdesk/flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error

  # ------------------------------------------------------------------- linux --
  linux:
    name: linux
    needs: bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch.sh rustdesk
      - name: Prerequisites
        run: |
          # Upstream's exact Linux list (flutter-build.yml). gstreamer is
          # required — scrap links gstreamer-sys.
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            pkg-config tree python3 rpm unzip wget xz-utils libssl-dev
          # RustDesk builds its own opus; a system one shadows it.
          sudo apt-get remove -y libopus-dev || true
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # A fixed directory, as upstream uses. Without it VCPKG_ROOT points
          # somewhere git does not know, and the install step dies with
          # "pathspec .../vcpkg did not match any file(s) known to git".
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'
          doNotCache: false
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --manifest-root="$GITHUB_WORKSPACE/src/rustdesk" \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"
      - uses: actions/download-artifact@v4
        with: { name: bridge-artifact }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ env.RUST_VERSION }}', components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src/rustdesk }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - name: Build rustdesk lib
        working-directory: src/rustdesk
        run: cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
      - name: Build
        working-directory: src/rustdesk
        # --skip-cargo: the lib was built in the previous step. Upstream splits
        # it this way so the slow Rust build is cacheable on its own.
        run: python3 ./build.py --flutter --skip-cargo
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk -maxdepth 2 -type f -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: rustdesk-client-linux, path: dist/, if-no-files-found: warn }

  # ----------------------------------------------------------------- windows --
  windows:
    name: windows
    needs: bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch.sh rustdesk
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'
          doNotCache: false
      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --manifest-root="$GITHUB_WORKSPACE/src/rustdesk" \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"
      - name: Point libsodium at vcpkg
        shell: bash
        run: |
          echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/x64-windows-static/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { name: bridge-artifact }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '${{ env.RUST_VERSION }}'
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src/rustdesk }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: choco install llvm -y --no-progress
      - name: Build
        working-directory: src/rustdesk
        shell: bash
        run: python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -type f -name 'rustdesk.exe' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: rustdesk-client-windows, path: dist/, if-no-files-found: warn }

  # ------------------------------------------------------------------- macos --
  macos:
    name: macos
    needs: bridge
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch.sh rustdesk
      - name: Prerequisites
        run: |
          brew install llvm create-dmg pkg-config yasm
          # NOT `brew install nasm` — that is NASM 3.x, which upstream avoids.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # A fixed directory, as upstream uses. Without it VCPKG_ROOT points
          # somewhere git does not know, and the install dies with "pathspec
          # .../vcpkg did not match any file(s) known to git".
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'
          doNotCache: false
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --manifest-root="$GITHUB_WORKSPACE/src/rustdesk" \
            --triplet arm64-osx \
            --x-install-root="$VCPKG_ROOT/installed"
      - uses: actions/download-artifact@v4
        with: { name: bridge-artifact }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '${{ env.MAC_RUST_VERSION }}'
          targets: aarch64-apple-darwin
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src/rustdesk }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - name: Build
        working-directory: src/rustdesk
        run: ./build.py --flutter --hwcodec --unix-file-copy-paste
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -maxdepth 6 -type d -name '*.app' -exec cp -r {} dist/ \; 2>/dev/null || true
          find src/rustdesk/flutter/build -type f -name '*.dmg' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: rustdesk-client-macos, path: dist/, if-no-files-found: warn }

  # ----------------------------------------------------------------- android --
  android:
    name: android
    needs: bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /
      - name: Prerequisites
        run: |
          # Same host libraries as the Linux job: the Rust build compiles
          # host-side crates (glib-sys, gstreamer-sys) before cross-compiling.
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget
          sudo apt-get remove -y libopus-dev || true
      - run: bash scripts/fetch.sh rustdesk
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # A fixed directory, as upstream uses. Without it VCPKG_ROOT points
          # somewhere git does not know, and the install dies with "pathspec
          # .../vcpkg did not match any file(s) known to git".
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'
          doNotCache: false
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --manifest-root="$GITHUB_WORKSPACE/src/rustdesk" \
            --triplet arm64-android \
            --x-install-root="$VCPKG_ROOT/installed"
      - uses: actions/download-artifact@v4
        with: { name: bridge-artifact }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK + NDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '${{ env.RUST_VERSION }}'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src/rustdesk }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
          cache: true
      - name: Build rustdesk lib
        working-directory: src/rustdesk
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          # The repo's own script: cargo ndk --platform 21 --target
          # aarch64-linux-android build --locked --release --features flutter,hwcodec
          bash flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          find ./target/aarch64-linux-android/release -maxdepth 1 -name '*.so' \
            -exec cp {} ./flutter/android/app/src/main/jniLibs/arm64-v8a/ \;
      - name: Build APK
        working-directory: src/rustdesk/flutter
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: rustdesk-client-android, path: dist/, if-no-files-found: warn }

  # --------------------------------------------------------------------- ios --
  ios:
    name: ios
    needs: bridge
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install nasm yasm || true
      - run: bash scripts/fetch.sh rustdesk
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # A fixed directory, as upstream uses. Without it VCPKG_ROOT points
          # somewhere git does not know, and the install dies with "pathspec
          # .../vcpkg did not match any file(s) known to git".
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'
          doNotCache: false
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --manifest-root="$GITHUB_WORKSPACE/src/rustdesk" \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"
      - uses: actions/download-artifact@v4
        with: { name: bridge-artifact }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '${{ env.MAC_RUST_VERSION }}'
          targets: aarch64-apple-ios
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src/rustdesk }
      - name: Build rustdesk lib
        working-directory: src/rustdesk
        # The repo's own script: cargo build --locked --features
        # flutter,hwcodec --release --target aarch64-apple-ios --lib
        run: bash flutter/ios_arm64.sh
      - name: Build ipa (unsigned)
        working-directory: src/rustdesk/flutter
        # --no-codesign, as upstream: installing needs an Apple certificate
        # this pipeline does not hold.
        run: flutter build ipa --release --no-codesign
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build/ios -type f -name '*.ipa' -exec cp {} dist/ \; 2>/dev/null || true
          find src/rustdesk/flutter/build/ios -maxdepth 4 -type d -name '*.app' -exec cp -r {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: rustdesk-client-ios, path: dist/, if-no-files-found: warn }

  # ---------------------------------------------------------------- harmonyos --
  #
  # The one genuine addition: upstream has no OHOS support. This builds
  # liyan-lucky's ArkTS app, which links a prebuilt librustdesk_core.a. The SDK
  # comes from a GitCode repo (split into 99 MB volumes, because GitHub caps a
  # release asset at 2 GiB and the archive is 2.3 GB). Its toolchain binaries
  # are ELF, so this is Linux-runner-only by nature.
  harmonyos:
    name: harmonyos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip p7zip-full curl jq python3 rsync
      - name: Clone the HarmonyOS app
        run: |
          git clone --depth 1 https://github.com/liyan-lucky/rustdesk_harmonyos.git src/harmonyos
          git -C src/harmonyos log --oneline -1
      - name: Install HarmonyOS SDK
        env:
          SDK_REPO: https://gitcode.com/rustzhang/harmonyos-sdk.git
        run: |
          set -euo pipefail
          SDK_BASE="$HOME/harmonyos-sdk"
          rm -rf "$SDK_BASE" "$RUNNER_TEMP/sdkx"
          mkdir -p "$SDK_BASE" "$RUNNER_TEMP/sdkx"
          git clone --depth 1 "$SDK_REPO" "$RUNNER_TEMP/sdkvol"
          cd "$RUNNER_TEMP/sdkvol"
          cat part-* > "$RUNNER_TEMP/sdk.zip"
          echo "reassembled: $(stat -c%s "$RUNNER_TEMP/sdk.zip") bytes"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdkx"
          echo "archive top level:"; find "$RUNNER_TEMP/sdkx" -maxdepth 2 -type d | head -20
          # The archive's top level is command-line-tools/ holding
          # bin/ ohpm/ hvigor/ tool/ and sdk/. Take the dir containing bin/.
          CAND="$(find "$RUNNER_TEMP/sdkx" -maxdepth 3 -type d -name bin -print -quit)"
          [ -n "$CAND" ] || { echo "no bin/ in the archive" >&2; find "$RUNNER_TEMP/sdkx" -maxdepth 3 -type d >&2; exit 1; }
          ROOT="$(dirname "$CAND")"
          echo "tools root: $ROOT"
          cp -r "$ROOT"/. "$SDK_BASE"/
          chmod +x "$SDK_BASE"/openharmony/native/build-tools/cmake/bin/* 2>/dev/null || true
          chmod +x "$SDK_BASE"/openharmony/native/llvm/bin/* 2>/dev/null || true
          chmod +x "$SDK_BASE"/hms/native/build-tools/cmake/bin/* 2>/dev/null || true
          chmod +x "$SDK_BASE"/hms/native/llvm/bin/* 2>/dev/null || true
          chmod +x "$SDK_BASE"/sdk/*/openharmony/native/llvm/bin/* 2>/dev/null || true
          SDK_HOME="$SDK_BASE/sdk"
          [ -d "$SDK_BASE/sdk/default/openharmony" ] && SDK_HOME="$SDK_BASE/sdk/default"
          echo "SDK_HOME=$SDK_HOME"; ls -la "$SDK_HOME" 2>/dev/null | head
          {
            echo "DEVECO_SDK_HOME=$SDK_HOME"
            echo "OHOS_HVIGOR_SDK_ROOT=$SDK_HOME"
            echo "DEVECO_TOOLS_HOME=$SDK_BASE"
            echo "DEVECO_NODE_EXE=$(command -v node)"
          } >> "$GITHUB_ENV"
          echo "$SDK_BASE/bin" >> "$GITHUB_PATH"
          echo "$SDK_BASE/ohpm/bin" >> "$GITHUB_PATH"
          echo "$SDK_BASE/hvigor/bin" >> "$GITHUB_PATH"
          echo "$SDK_HOME/openharmony/native/llvm/bin" >> "$GITHUB_PATH"
      - name: Build HAP
        working-directory: src/harmonyos
        env:
          HARMONY_ARTIFACTS_DIR: ${{ runner.temp }}/harmonyos-artifacts
        run: |
          mkdir -p "$HARMONY_ARTIFACTS_DIR"
          chmod +x scripts/github_build_harmonyos_linux.sh
          scripts/github_build_harmonyos_linux.sh \
            --artifact-type hap \
            --version-bump none \
            --artifacts-dir "$HARMONY_ARTIFACTS_DIR" \
            --abi-filter arm64-v8a \
            --skip-package-verify
      - name: Collect
        run: |
          mkdir -p dist
          find src/harmonyos "$HARMONY_ARTIFACTS_DIR" -type f -name '*.hap' \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: rustdesk-client-harmonyos, path: dist/, if-no-files-found: warn }
