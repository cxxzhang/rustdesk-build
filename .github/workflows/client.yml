# RustDesk client, one job per platform.
#
# GitHub gives us native Windows and macOS runners, so unlike a Linux-only CI
# there is no cross-compiling: `flutter build windows` runs on Windows and
# `flutter build macos` on macOS, each with the toolchain the platform expects.
#
# The Rust<->Dart bridge (flutter_rust_bridge) is normally generated on a
# separate machine and committed. If the checkout has none, it is generated
# here with the codegen version pinned to match `flutter_rust_bridge` in
# Cargo.toml — a mismatch produces a Dart/Rust pair that will not compile.
#
# Marked `continue-on-error` per job on purpose: these are the parts most
# likely to need iteration on a first run, and a red macOS job should not hide
# a green Linux one.
name: client

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'patches/**', '.github/workflows/client.yml']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter SDK version
        default: '3.24.5'

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.5' }}
  FRB_CODEGEN_VERSION: '2.0.0-dev.37'

jobs:
  linux:
    name: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libasound2-dev libpulse-dev libva-dev libvdpau-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxfixes-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libpipewire-0.3-dev libwayland-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/fetch.sh rustdesk
      - name: Generate bridge if missing
        working-directory: src/rustdesk
        run: |
          if [ ! -f flutter/lib/generated_bridge.dart ] && [ ! -d flutter/lib/generated ]; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
            flutter_rust_bridge_codegen generate
          fi
      - name: Build
        working-directory: src/rustdesk
        run: python3 build.py --flutter --skip-portable-pack
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -name 'rustdesk' -type f -exec cp {} dist/ \; || true
          find src/rustdesk/flutter/build -name '*.deb' -o -name '*.AppImage' | head -5
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-linux
          path: dist/
          if-no-files-found: warn

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: LLVM
        run: choco install llvm -y --no-progress
      - run: bash scripts/fetch.sh rustdesk
      - name: Generate bridge if missing
        working-directory: src/rustdesk
        shell: bash
        run: |
          if [ ! -f flutter/lib/generated_bridge.dart ] && [ ! -d flutter/lib/generated ]; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
            flutter_rust_bridge_codegen generate
          fi
      - name: Build
        working-directory: src/rustdesk
        shell: bash
        run: python build.py --flutter --skip-portable-pack
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -name 'rustdesk.exe' -exec cp {} dist/ \; || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-windows
          path: dist/
          if-no-files-found: warn

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: brew install create-dmg || true
      - run: bash scripts/fetch.sh rustdesk
      - name: Generate bridge if missing
        working-directory: src/rustdesk
        run: |
          if [ ! -f flutter/lib/generated_bridge.dart ] && [ ! -d flutter/lib/generated ]; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
            flutter_rust_bridge_codegen generate
          fi
      - name: Build
        working-directory: src/rustdesk
        run: python3 build.py --flutter --skip-portable-pack
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -name '*.app' -maxdepth 6 -exec cp -r {} dist/ \; || true
          find src/rustdesk/flutter/build -name '*.dmg' -exec cp {} dist/ \; || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-macos
          path: dist/
          if-no-files-found: warn

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK + NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: cargo install cargo-ndk --locked
      - run: bash scripts/fetch.sh rustdesk
      - name: Generate bridge if missing
        working-directory: src/rustdesk
        run: |
          if [ ! -f flutter/lib/generated_bridge.dart ] && [ ! -d flutter/lib/generated ]; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_CODEGEN_VERSION" --locked
            flutter_rust_bridge_codegen generate
          fi
      - name: Build APK
        working-directory: src/rustdesk
        run: python3 build.py --flutter --skip-portable-pack
      - name: Collect
        run: |
          mkdir -p dist
          find src/rustdesk/flutter/build -name '*.apk' -exec cp {} dist/ \; || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-client-android
          path: dist/
          if-no-files-found: warn
