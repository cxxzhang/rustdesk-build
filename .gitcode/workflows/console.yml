# The console: Go backend (cross-compiles to every OS with CGO_ENABLED=0) and
# the Vue admin as static files (platform independent).
name: console

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.gitcode/workflows/console.yml']
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.24.0'
  PNPM_VERSION: '9'

jobs:
  backend:
    name: console backend (${{ matrix.os }})
    runs-on: [ubuntu-latest, x64, medium]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, suffix: linux-amd64 }
          - { goos: windows, goarch: amd64, suffix: windows-amd64.exe }
          - { goos: darwin,  goarch: amd64, suffix: darwin-amd64 }
          - { goos: darwin,  goarch: arm64, suffix: darwin-arm64 }
    steps:
      - name: Checkout pipeline
        uses: checkout

      - name: Fetch andesk-api-server-pro
        run: bash scripts/fetch.sh andesk-api-server-pro
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -xz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_ENV"

      - name: Build
        working-directory: src/andesk-api-server-pro/backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOPROXY: https://goproxy.cn,direct
        run: |
          mkdir -p "$ATOMGIT_WORKSPACE/dist"
          go build -trimpath -ldflags "-s -w" \
            -o "$ATOMGIT_WORKSPACE/dist/rustdesk-api-server-pro-${{ matrix.suffix }}" .

      - name: Upload
        uses: upload-artifact
        with:
          name: andesk-console-${{ matrix.suffix }}
          path: dist/

  frontend:
    name: console admin UI
    runs-on: [ubuntu-latest, x64, medium]
    steps:
      - name: Checkout pipeline
        uses: checkout

      - name: Fetch andesk-api-server-pro
        run: bash scripts/fetch.sh andesk-api-server-pro
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

      - name: Install Node
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            | sudo tar -xJ -C /opt
          echo "/opt/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_ENV"
          corepack enable || true
          npm i -g "pnpm@${PNPM_VERSION}" --registry https://registry.npmmirror.com

      - name: Build admin UI
        working-directory: src/andesk-api-server-pro/soybean-admin
        run: |
          pnpm install --frozen-lockfile --registry https://registry.npmmirror.com
          pnpm build

      - name: Collect
        run: |
          mkdir -p dist/api
          cp -r src/andesk-api-server-pro/soybean-admin/dist/. dist/api/
          cp src/andesk-api-server-pro/server-dist/start.bat dist/api/ 2>/dev/null || true
          cp src/andesk-api-server-pro/server-dist/server.yaml dist/api/ 2>/dev/null || true

      - name: Upload
        uses: upload-artifact
        with:
          name: andesk-console-ui
          path: dist/
