# The browser client (npm) and its bundled TURN server (Go), for Linux and
# Windows. Both cross-compile: Go with GOOS/GOARCH, the client is static files.
name: web

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.gitcode/workflows/web.yml']
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.24.0'

jobs:
  client:
    name: browser client + TURN
    runs-on: [ubuntu-latest, x64, medium]
    steps:
      - name: Checkout pipeline
        uses: checkout

      - name: Fetch andesk-webclient
        run: bash scripts/fetch.sh andesk-webclient
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

      - name: Install Node
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}.x/SHASUMS256.txt" >/dev/null 2>&1 || true
          # NodeSource would need sudo+apt; a portable tarball avoids both and
          # matches what the deployment uses.
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            | sudo tar -xJ -C /opt
          echo "/opt/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_ENV"

      - name: Build the client
        working-directory: src/andesk-webclient
        run: |
          npm ci --registry https://registry.npmmirror.com --no-audit --no-fund \
            || npm install --registry https://registry.npmmirror.com --no-audit --no-fund
          npm run gen
          npm run build

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -xz -C /usr/local
          echo "/usr/local/go/bin" >> "$GITHUB_ENV"

      - name: Build TURN (linux + windows)
        working-directory: src/andesk-webclient/tools/turnserver
        run: |
          mkdir -p "$ATOMGIT_WORKSPACE/dist"
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -o "$ATOMGIT_WORKSPACE/dist/andesk-turn-linux-amd64" .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$ATOMGIT_WORKSPACE/dist/andesk-turn-windows-amd64.exe" .
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -o "$ATOMGIT_WORKSPACE/dist/andesk-turn-darwin-amd64" .

      - name: Collect web client
        run: |
          mkdir -p dist/web
          cp -r src/andesk-webclient/dist/. dist/web/

      - name: Upload
        uses: upload-artifact
        with:
          name: andesk-web
          path: dist/
