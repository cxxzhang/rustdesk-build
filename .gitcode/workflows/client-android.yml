# RustDesk client for Android.
#
# The Flutter Android build is driven by the repo's own `build.py --flutter`,
# which reads a features.toml to decide what to compile. The generated
# Rust<->Dart bridge (flutter_rust_bridge) is normally built on a separate
# machine and committed; upstream ships it as a release artifact, so if the
# checkout has no bridge this job regenerates it with the pinned codegen.
#
# flutter_rust_bridge_codegen must match the `flutter_rust_bridge` version in
# Cargo.toml, otherwise the generated Dart/Rust pair does not line up.
name: client-android

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.gitcode/workflows/client-android.yml']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter SDK version
        default: '3.24.5'

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.5' }}
  FLUTTER_RUST_BRIDGE_CODEGEN_VERSION: '2.0.0-dev.37'
  NDK_VERSION: '27.0.12077973'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  build:
    name: android (arm64-v8a)
    runs-on: [ubuntu-latest, x64, large]
    steps:
      - name: Checkout pipeline
        uses: checkout

      - name: Fetch andesk-rustdesk-client
        run: bash scripts/fetch.sh andesk-rustdesk-client
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

      - name: Install JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_ENV"

      - name: Install Android SDK + NDK
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          sudo unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_ENV"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare bridge and codegen
        working-directory: src/andesk-rustdesk-client
        run: |
          flutter config --no-analytics
          flutter precache --android
          if [ ! -f flutter/lib/generated_bridge.dart ] && [ ! -d flutter/lib/generated ]; then
            echo "== generating the flutter_rust_bridge bindings"
            cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_CODEGEN_VERSION" --locked
            flutter_rust_bridge_codegen generate
          else
            echo "== bridge already present in the checkout"
          fi

      - name: Build APK
        working-directory: src/andesk-rustdesk-client
        run: python3 build.py --flutter --skip-portable-pack

      - name: Collect
        run: |
          mkdir -p dist
          find src/andesk-rustdesk-client/flutter/build -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload
        uses: upload-artifact
        with:
          name: andesk-client-android
          path: dist/
