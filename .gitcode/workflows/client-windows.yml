# RustDesk client for Windows (x86_64-pc-windows-msvc), built from a Linux
# runner — the same way upstream's flutter-build.yml does it: the MSVC linker
# runs under LLVM (`lld-link`), which is why the job installs clang/lld rather
# than needing a Windows host.
#
# Needs the four C static libraries (libyuv / opus / libaom / libvpx) built with
# a static CRT. Those are the slow, fragile part; they are built once here and
# cached, keyed on the script that builds them.
name: client-windows

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.gitcode/workflows/client-windows.yml']
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter SDK version
        default: '3.24.5'

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.24.5' }}
  FLUTTER_RUST_BRIDGE_CODEGEN_VERSION: '2.0.0-dev.37'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  build:
    name: windows (x64)
    runs-on: [ubuntu-latest, x64, xlarge]
    steps:
      - name: Checkout pipeline
        uses: checkout

      - name: Fetch andesk-rustdesk-client
        run: bash scripts/fetch.sh andesk-rustdesk-client
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

      - name: Install LLVM (clang + lld for the MSVC target)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_ENV"
          flutter config --enable-windows-desktop --no-analytics
          flutter precache --windows

      - name: Install Rust + Windows target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_ENV"
          rustup target add x86_64-pc-windows-msvc

      - name: Build C dependencies (cached)
        uses: cache
        with:
          key: rustdesk-win-clibs-${{ hashFiles('scripts/build-win-clibs.sh') }}
          path: ~/.cache/andesk-win-clibs

      - name: Build C dependencies
        run: bash scripts/build-win-clibs.sh

      - name: Prepare bridge and codegen
        working-directory: src/andesk-rustdesk-client
        run: |
          if [ ! -f flutter/lib/generated_bridge.dart ] && [ ! -d flutter/lib/generated ]; then
            cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_CODEGEN_VERSION" --locked
            flutter_rust_bridge_codegen generate
          fi

      - name: Build
        working-directory: src/andesk-rustdesk-client
        env:
          VCPKG_ROOT: ${{ env.ATOMGIT_WORKSPACE }}/vcpkg
        run: python3 build.py --flutter --skip-portable-pack

      - name: Collect
        run: |
          mkdir -p dist
          find src/andesk-rustdesk-client/flutter/build -name '*.exe' -o -name '*.msi' -o -name '*.zip' | head -20
          find src/andesk-rustdesk-client/flutter/build -name 'rustdesk.exe' -exec cp {} dist/ \; || true
          ls -la dist

      - name: Upload
        uses: upload-artifact
        with:
          name: andesk-client-windows
          path: dist/
